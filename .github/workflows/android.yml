name: Android – compilation de l'APK

on:
  push:
    paths-ignore: ["web/**"]
  pull_request:
    paths-ignore: ["web/**"]
  workflow_dispatch:

jobs:
  build:
    # Image Ubuntu 24.04 : le SDK Android y est préinstallé ($ANDROID_HOME)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compiler l'APK (debug)
        run: ./gradlew --no-configuration-cache assembleDebug

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: ProfSuivi-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Tests unitaires
        run: ./gradlew --no-configuration-cache testDebugUnitTest

      - name: Résumé des tests en échec
        if: failure()
        run: |
          ls app/build/test-results/testDebugUnitTest/*.xml >/dev/null 2>&1 || echo "::error title=Tests::Aucun résultat de test (échec de compilation des tests ?)"
          for f in app/build/test-results/testDebugUnitTest/*.xml; do
            [ -f "$f" ] || continue
            python3 - "$f" <<'PY'
          import sys, xml.etree.ElementTree as ET
          for tc in ET.parse(sys.argv[1]).getroot().iter("testcase"):
              for fl in list(tc.findall("failure")) + list(tc.findall("error")):
                  msg = (fl.get("message") or fl.text or "").replace("\n", " ")[:400]
                  print(f"::error title={tc.get('classname')}.{tc.get('name')}::{msg}")
          PY
          done
